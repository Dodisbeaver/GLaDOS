services:
  # GLaDOS TTS API (existing service)
  tts-api:
    build: .
    ports:
      - '${TTS_PORT:-5050}:5050'
    volumes:
      - glados-models:/app/models
    environment:
      - GLADOS_MODELS_PATH=/app/models

  # GLaDOS Assistant Container (Python backend)
  glados:
    build:
      context: .
      dockerfile: Dockerfile.assistant
      args:
        RUNTIME: ${GLADOS_RUNTIME:-cpu}  # cpu or cuda
    volumes:
      - glados-models:/app/models
      - ./configs:/app/configs:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/api/chat}
      - GLADOS_AUDIO_IO=webrtc
      - GLADOS_PROXY_URL=ws://audio-proxy:3000/glados
    depends_on:
      - audio-proxy
    restart: unless-stopped
    networks:
      - default
      - ollama-network


  # Audio Proxy Service (NEW - WebRTC approach)
  audio-proxy:
    build:
      context: ./audio_proxy
    ports:
      - "${PROXY_PORT:-3000}:3000"
      - "${PROXY_HTTPS_PORT:-10306}:3443"
    environment:
      - NODE_ENV=production
      - GLADOS_WS_URL=ws://glados:8765
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  glados-models:
    driver: local

# Network configuration
networks:
  default:
    name: glados-network
  ollama-network:
    external: true
