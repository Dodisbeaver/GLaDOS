services:
  # GLaDOS TTS API (existing service)
  tts-api:
    build: .
    ports:
      - '${TTS_PORT:-5050}:5050'
    volumes:
      - glados-models:/app/models
    environment:
      - GLADOS_MODELS_PATH=/app/models

  # GLaDOS Assistant Container (Python backend)
  glados:
    build:
      context: .
      dockerfile: Dockerfile.assistant
      args:
        RUNTIME: ${GLADOS_RUNTIME:-cpu}  # cpu or cuda
    volumes:
      - glados-models:/app/models
      - ./configs:/app/configs:ro
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/api/chat}
      - GLADOS_AUDIO_IO=webrtc
      - GLADOS_PROXY_URL=ws://audio-proxy:6080/glados
    depends_on:
      - audio-proxy
    restart: unless-stopped
    networks:
      - default


  # Audio Proxy Service (NEW - WebRTC approach)
  audio-proxy:
    build:
      context: ./audio_proxy
    ports:
      - "${PROXY_PORT:-6080}:6080"
      - "${PROXY_HTTPS_PORT:-6443}:6443"
    environment:
      - NODE_ENV=production
      - GLADOS_WS_URL=ws://glados:8765
      - PORT=${PROXY_PORT:-6080}
      - HTTPS_PORT=${PROXY_HTTPS_PORT:-6443}
      # SSL configuration
      - SSL_COUNTRY=${SSL_COUNTRY:-US}
      - SSL_STATE=${SSL_STATE:-California}
      - SSL_CITY=${SSL_CITY:-San Francisco}
      - SSL_ORG=${SSL_ORG:-GLaDOS}
      - SSL_OU=${SSL_OU:-Audio Proxy}
      - SSL_CN=${SSL_CN:-audio-proxy}
      - SSL_EMAIL=${SSL_EMAIL:-admin@localhost}
      - SSL_LAN_IP=${SSL_LAN_IP:-192.168.1.100}
      - SSL_EXTERNAL_IP=${SSL_EXTERNAL_IP:-}
      - SSL_DOMAINS=${SSL_DOMAINS:-}
      - SSL_DAYS=${SSL_DAYS:-365}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  glados-models:
    driver: local

# Network configuration
networks:
  default:
    name: glados-network
